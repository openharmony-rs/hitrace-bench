[package]
name = "hitrace-bench"
version = "0.11.4"
edition = "2024"
repository = "https://github.com/openharmony-rs/hitrace-bench"
description = "Allows benching of servo on ohos using the hitrace library."
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
env_logger = "0.11.11"
humanize-bytes = "1.0.6"
itertools = "0.15.0"
json5 = "0.4.1"
log = "0.4.33"
regex = "1.13"
rust_decimal = { version = "1.42.1", features = ["serde-with-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
time = { version = "0.3.55", features = ["macros", "parsing", "serde"] }
which = "8.0.5"
yansi = { version = "1.0.1", features = ["detect-env", "detect-tty"] }
